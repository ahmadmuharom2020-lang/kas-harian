<!DOCTYPE html>

<style>

  :root {
    --bg:#F6F3EC; --card:#FFFFFF; --ink:#1E2A28; --ink-soft:#5B6663;
    --primary:#2C4A43; --primary-dark:#1B302B; --income:#A8791F; --income-bg:#FBF1DC;

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); }
  body { color:var(--ink); font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif; padding-bottom:48px; }
  .font-display { font-family:'Fraunces', Georgia, serif; }
  .mono { font-family:'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }

  .container { max-width: 640px; margin:0 auto; padding: 0 20px; }

  .app-header { background: var(--primary); color:#fff; padding: 20px 0 16px; }
  .eyebrow { font-size:12px; letter-spacing:.15em; text-transform:uppercase; opacity:.7; margin:0 0 2px; }
  .title { font-size:24px; margin:0 0 12px; color:#F3E9C7; }

  .pill { border:none; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:500; cursor:pointer; background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .save-indicator { font-size:12px; opacity:.6; }

  .stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .stat-box { border-radius:12px; padding:8px; background:rgba(255,255,255,0.08); min-width:0; }
  .stat-box.highlight { background:#F3E9C7; color:var(--primary-dark); }
  .stat-label { display:flex; align-items:center; gap:4px; font-size:11px; opacity:.7; margin-bottom:2px; }
  .stat-value { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .content { margin-top: -8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:12px; overflow:hidden; }

  .btn-outline { background:transparent; border:1px solid var(--line); color:var(--ink); }

  .chip-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center; }

  .mt-1 { margin-top:4px; } .mt-2 { margin-top:8px; }

  .input, select.input, textarea.input {
    width:100%; padding:8px 10px; border-radius:10px; border:1px solid var(--line); font-size:14px; font-family:inherit; background:#fff; color:var(--ink);

  .form-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }

  .type-toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .type-toggle button { flex:1; border:none; background:transparent; padding:8px; font-size:14px; font-weight:500; cursor:pointer; color:var(--ink-soft); }
  .type-toggle button.active-income { background:var(--income-bg); color:var(--income); }
  .type-toggle button.active-expense { background:var(--expense-bg); color:var(--expense); }

  .error-text { font-size:12px; color:var(--expense); margin-bottom:8px; }

  .table-wrap { overflow:auto; max-height:340px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:500; font-size:12px; color:var(--ink-soft); padding:8px 16px; }
  td { padding:8px 16px; border-top:1px solid var(--line); vertical-align:middle; }
  .amount-income { color:var(--income); font-weight:500; }
  .amount-expense { color:var(--expense); font-weight:500; }
  .empty-state { padding:24px; text-align:center; font-size:14px; color:var(--ink-soft); }

  .badge-paid { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--income-bg); color:var(--income); }

/* ================= Helpers ================= */
var STORAGE_KEY = 'kas-harian-store-v1';

var DEFAULT_CATEGORIES = {
  income: ['Tarif Order', 'Tip', 'Bonus Mitra'],

var PRIORITY_LABELS = { '1': 'Core', '2': 'Pendukung', '3': 'Watchlist' };
var PRIORITY_1_ORDER = ['TLKM', 'SMSM', 'AKRA', 'DMAS', 'UNTR', 'AALI', 'PTBA', 'SIDO'];

function todayStr() {
  var d = new Date();
  var off = d.getTimezoneOffset();
  var local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
}
function formatRupiah(n) {
  n = n || 0;
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function formatDMY(dateStr) {
  if (!dateStr) return '-';
  var parts = dateStr.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function daysUntil(dateStr) {
  var target = new Date(dateStr + 'T00:00:00');
  var today = new Date(todayStr() + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function addMonths(dateStr, n) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(parts[0], parts[1] - 1 + n, parts[2]);
  var yy = dt.getFullYear();
  var mm = String(dt.getMonth() + 1).padStart(2, '0');
  var dd = String(dt.getDate()).padStart(2, '0');
  return yy + '-' + mm + '-' + dd;
}
function addDays(dateStr, n) {
  var dt = new Date(dateStr + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  var yy = dt.getFullYear();
  var mm = String(dt.getMonth() + 1).padStart(2, '0');
  var dd = String(dt.getDate()).padStart(2, '0');
  return yy + '-' + mm + '-' + dd;
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function mergeTipIntoTransactions(txs, date, amountToAdd) {
  var idx = -1;
  for (var i = 0; i < txs.length; i++) {
    if (txs[i].type === 'income' && txs[i].category === 'Tip' && txs[i].date === date) { idx = i; break; }
  }
  if (idx >= 0) {
    var updated = txs.slice();
    updated[idx] = Object.assign({}, updated[idx], { amount: updated[idx].amount + amountToAdd });
    return updated;
  }
  return [{ id: uid(), date: date, type: 'income', category: 'Tip', note: 'Setoran tally tip harian', amount: amountToAdd, createdAt: Date.now() }].concat(txs);
}
function isValidBackup(obj) {
  return !!(obj && typeof obj === 'object' && Array.isArray(obj.transactions) && obj.categories &&
    Array.isArray(obj.categories.income) && Array.isArray(obj.categories.expense));
}

  wrench: icon('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>', 16),

/* ================= Persistence ================= */
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    applyLoadedData(parsed);
    localUpdatedAt = parsed.updatedAt || 0;
  } catch (e) {
    console.error('Gagal memuat data', e);
  }
}
function applyLoadedData(parsed) {
  var cats = parsed.categories || DEFAULT_CATEGORIES;
  var txs = parsed.transactions || [];
  var tly = parsed.tally || { date: todayStr(), count: 0, total: 0 };
  var lns = Array.isArray(parsed.loans) ? parsed.loans : [];
  var etx = Array.isArray(parsed.emergencyTx) ? parsed.emergencyTx : [];
  var vmtRaw = Array.isArray(parsed.vehicleMaintenanceTypes) ? parsed.vehicleMaintenanceTypes : [];
  var vmt = vmtRaw.length > 0 ? vmtRaw : [{ id: uid(), name: 'Ganti Oli', category: 'Ganti Oli', intervalDays: 15 }];
  var smst = Array.isArray(parsed.stockMaster) ? parsed.stockMaster : [];
  var stx = Array.isArray(parsed.stockTx) ? parsed.stockTx : [];
  var prc = (parsed.prices && typeof parsed.prices === 'object') ? parsed.prices : {};
  var stgt = Array.isArray(parsed.stockTargets) ? parsed.stockTargets : [];

  var today = todayStr();
  if (tly.date !== today) {
    if (tly.total > 0) txs = mergeTipIntoTransactions(txs, tly.date, tly.total);
    tly = { date: today, count: 0, total: 0 };
  }

  state.categories = cats;
  state.transactions = txs;
  state.tally = tly;
  state.loans = lns;
  state.emergencyTx = etx;
  state.vehicleMaintenanceTypes = vmt;
  state.stockMaster = smst;
  state.stockTx = stx;
  state.prices = prc;
  state.stockTargets = stgt;
  state.txCategory = (cats.income && cats.income[0]) || DEFAULT_CATEGORIES.income[0];
}
var localUpdatedAt = 0;

function currentDataForSave() {
  return {
    categories: state.categories,
    transactions: state.transactions,
    tally: state.tally,
    loans: state.loans,
    emergencyTx: state.emergencyTx,
    vehicleMaintenanceTypes: state.vehicleMaintenanceTypes,
    stockMaster: state.stockMaster,
    stockTx: state.stockTx,
    prices: state.prices,
    stockTargets: state.stockTargets
  };
}
function saveData() {
  localUpdatedAt = Date.now();
  try {
    var payload = currentDataForSave();
    payload.updatedAt = localUpdatedAt;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.error('Gagal menyimpan data', e);
  }
  pushToCloud();
}

  var el = document.getElementById('accessCodeInput');
  var val = el ? el.value.trim() : '';
  if (!val) return;
  localStorage.setItem(ACCESS_CODE_KEY, val);
  accessCode = val;
  render();
  initCloudSync();
}
function gantiKodeAkses() {
  localStorage.removeItem(ACCESS_CODE_KEY);
  accessCode = '';
  state.cloudStatus = 'idle';
  render();
}
function applyRemoteData(cloud) {
  applyLoadedData(cloud);
  localUpdatedAt = cloud.updatedAt || Date.now();
  try {
    var payload = currentDataForSave();
    payload.updatedAt = localUpdatedAt;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {}
}
function initCloudSync() {
  if (!accessCode) return;
  if (!window.__fsDb) { state.cloudStatus = 'offline'; render(); return; }
  state.cloudStatus = 'connecting';
  render();
  var ref = window.__fsDoc(window.__fsDb, 'kas_harian', accessCode);
  window.__fsGetDoc(ref).then(function (snap) {
    if (snap.exists()) {
      var cloud = snap.data();
      var cloudUpdatedAt = cloud.updatedAt || 0;
      if (cloudUpdatedAt > localUpdatedAt) {
        // Cloud lebih baru dari data lokal (misal habis diedit dari HP lain) -> pakai data cloud
        applyRemoteData(cloud);
        state.cloudStatus = 'connected';
        render();
      } else {
        // Data lokal sama atau lebih baru -> jangan ditimpa. Kalau lokal lebih baru, dorong ke cloud biar sinkron.
        state.cloudStatus = 'connected';
        render();
        if (localUpdatedAt > cloudUpdatedAt) pushToCloud();
      }
    } else {
      var data = currentDataForSave();
      data.updatedAt = localUpdatedAt || Date.now();
      return window.__fsSetDoc(ref, data).then(function () { state.cloudStatus = 'connected'; render(); });
    }
  }).catch(function (e) {
    console.error('Gagal sinkron ke cloud', e);
    state.cloudStatus = 'offline';
    render();
  });
}
function pushToCloud() {
  if (!accessCode || !window.__fsDb) return;
  var ref = window.__fsDoc(window.__fsDb, 'kas_harian', accessCode);
  var data = currentDataForSave();
  data.updatedAt = localUpdatedAt || Date.now();
  window.__fsSetDoc(ref, data).then(function () {
    state.cloudStatus = 'connected';
    render();
  }).catch(function (e) {
    console.error('Gagal push ke cloud', e);
    state.cloudStatus = 'offline';
    render();
  });
}

  return '';

/* ================= Kesehatan Finansial ================= */
function avgMonthlyExpense3mo() {
  var now = new Date();
  var totalSum = 0, monthsWithData = 0;
  for (var i = 0; i < 3; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var y = d.getFullYear(), m = d.getMonth();
    var monthTotal = state.transactions.filter(function (t) { return t.type === 'expense'; })
      .filter(function (t) { var td = new Date(t.date + 'T00:00:00'); return td.getFullYear() === y && td.getMonth() === m; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
    if (monthTotal > 0) { totalSum += monthTotal; monthsWithData++; }
  }
  return monthsWithData > 0 ? totalSum / monthsWithData : 0;
}
function avgMonthlyIncome3mo() {
  var now = new Date();
  var totalSum = 0, monthsWithData = 0;
  for (var i = 0; i < 3; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var y = d.getFullYear(), m = d.getMonth();
    var monthTotal = state.transactions.filter(function (t) { return t.type === 'income'; })
      .filter(function (t) { var td = new Date(t.date + 'T00:00:00'); return td.getFullYear() === y && td.getMonth() === m; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
    if (monthTotal > 0) { totalSum += monthTotal; monthsWithData++; }
  }
  return monthsWithData > 0 ? totalSum / monthsWithData : 0;
}
function emergencyBalance() {
  return state.emergencyTx.reduce(function (sum, t) { return sum + (t.type === 'nabung' ? t.amount : -t.amount); }, 0);
}
function emergencyTargetAuto() {
  return avgMonthlyExpense3mo() * 6;
}
function financialHealth() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var monthTx = state.transactions.filter(function (t) { var d = new Date(t.date + 'T00:00:00'); return d.getFullYear() === y && d.getMonth() === m; });
  var income = monthTx.filter(function (t) { return t.type === 'income'; }).reduce(function (s, t) { return s + t.amount; }, 0);
  var expense = monthTx.filter(function (t) { return t.type === 'expense'; }).reduce(function (s, t) { return s + t.amount; }, 0);
  var savingsRate = income > 0 ? ((income - expense) / income) * 100 : (expense > 0 ? -100 : null);

  var incomeBase = avgMonthlyIncome3mo() > 0 ? avgMonthlyIncome3mo() : income;
  var activeLoans = state.loans.filter(function (l) { return (l.tenorPaid || 0) < l.tenor; });
  var monthlyInstallment = activeLoans.reduce(function (s, l) { return s + l.installmentAmount; }, 0);
  var debtRatio = incomeBase > 0 ? (monthlyInstallment / incomeBase) * 100 : (monthlyInstallment > 0 ? 999 : 0);

  var emBal = emergencyBalance();
  var avgExp = avgMonthlyExpense3mo();
  var emergencyMonthsCovered = avgExp > 0 ? emBal / avgExp : null;

  var savingsScore = savingsRate === null ? 12 : savingsRate >= 20 ? 25 : savingsRate >= 10 ? 18 : savingsRate >= 0 ? 10 : 0;
  var debtScore = debtRatio <= 20 ? 25 : debtRatio <= 36 ? 18 : debtRatio <= 43 ? 10 : 0;
  var emergencyScore = emergencyMonthsCovered === null ? 12 : emergencyMonthsCovered >= 6 ? 25 : emergencyMonthsCovered >= 3 ? 18 : emergencyMonthsCovered >= 1 ? 10 : 0;
  var portfolioScore = 12; // modul saham belum ada di versi ini

  var score = Math.round(savingsScore + debtScore + emergencyScore + portfolioScore);
  var status, color, bg;
  if (score >= 70) { status = 'Sehat'; color = 'var(--primary)'; bg = '#E3EFE9'; }
  else if (score >= 40) { status = 'Perlu Perhatian'; color = '#A8791F'; bg = 'var(--income-bg)'; }
  else { status = 'Waspada'; color = 'var(--expense)'; bg = 'var(--expense-bg)'; }

  var tips = [];
  if (savingsScore <= 10) tips.push(income > 0 ? 'Tekan pengeluaran non-esensial' : 'Belum ada pemasukan tercatat bulan ini');
  if (debtScore <= 10) tips.push('Hindari menambah utang baru dulu');
  if (emergencyScore <= 10) tips.push('Prioritaskan menabung dana darurat');
  if (tips.length === 0) tips.push('Semua indikator baik, pertahankan!');

  return { score: score, status: status, color: color, bg: bg, tips: tips };
}
function renderFinancialHealth() {
  var fh = financialHealth();
  return '<div class="fh-banner" style="background:' + fh.bg + ';">' +
    '<div class="fh-line1" style="color:' + fh.color + ';">' + ICONS.gauge +
    '<span style="font-weight:700;font-size:14px;">' + fh.status + '</span>' +

    '<div class="fh-line2" style="color:' + fh.color + ';">' + escapeHtml(fh.tips.join(' \u2022 ')) + '</div>' +
    '</div>';
}

function holdings() {
  var map = {}, order = [];
  state.stockMaster.forEach(function (m) {
    if ((m.initialLot || 0) > 0) {
      var key0 = m.ticker + '|' + m.market;
      var shares0 = m.market === 'idx' ? m.initialLot * 100 : m.initialLot;
      map[key0] = { ticker: m.ticker, market: m.market, shares: shares0, costBasis: shares0 * (m.initialAvgPrice || 0) };
      order.push(key0);
    }
  });
  state.stockTx.forEach(function (t) {
    if (t.type !== 'buy' && t.type !== 'sell') return;
    var key = t.ticker + '|' + t.market;
    if (!map[key]) { map[key] = { ticker: t.ticker, market: t.market, shares: 0, costBasis: 0 }; order.push(key); }
    var h = map[key];
    if (t.type === 'buy') {
      h.shares += t.shares;
      h.costBasis += t.shares * t.price + (t.fee || 0);
    } else {
      var avgCost = h.shares > 0 ? h.costBasis / h.shares : 0;
      h.shares -= t.shares;
      h.costBasis -= avgCost * t.shares;
      if (h.shares < 0) h.shares = 0;
      if (h.costBasis < 0) h.costBasis = 0;
    }
  });
  return order.map(function (k) { return map[k]; }).filter(function (h) { return h.shares > 0; });
}
function portfolioTotals() {
  var totalCost = 0, totalValue = 0;
  holdings().forEach(function (h) {
    var priceInfo = state.prices[h.ticker];
    var price = priceInfo ? priceInfo.price : (h.shares > 0 ? h.costBasis / h.shares : 0);
    totalCost += h.costBasis;
    totalValue += price * h.shares;
  });
  return { totalCost: totalCost, totalValue: totalValue, gain: totalValue - totalCost };
}
function sortedStockMaster() {
  return state.stockMaster.slice().sort(function (a, b) {
    var pa = a.priority || '1', pb = b.priority || '1';
    if (pa !== pb) return pa.localeCompare(pb);
    if (pa === '1') {
      var ia = PRIORITY_1_ORDER.indexOf(a.ticker), ib = PRIORITY_1_ORDER.indexOf(b.ticker);
      var ra = ia === -1 ? PRIORITY_1_ORDER.length : ia, rb = ib === -1 ? PRIORITY_1_ORDER.length : ib;
      if (ra !== rb) return ra - rb;
    }
    return a.ticker.localeCompare(b.ticker);
  });
}

/* ================= Kalender Dividen ================= */
function dividendCalendar() {
  var map = {};
  state.stockTx.filter(function (t) { return t.type === 'dividend'; }).forEach(function (t) {
    var ym = (t.paymentDate || t.date).slice(0, 7);
    if (!map[ym]) map[ym] = [];
    map[ym].push(t);
  });
  Object.keys(map).forEach(function (ym) { map[ym].sort(function (a, b) { return (a.paymentDate || a.date).localeCompare(b.paymentDate || b.date); }); });
  return map;
}
function getMonthDividendDisplay(cal, year, monthIndex) {
  var ym = year + '-' + String(monthIndex + 1).padStart(2, '0');
  var actual = cal[ym] || [];
  if (actual.length > 0) return { entries: actual, isHistorical: false, sourceYear: year };
  var ymPrev = (year - 1) + '-' + String(monthIndex + 1).padStart(2, '0');
  var prevYear = cal[ymPrev] || [];
  if (prevYear.length > 0) return { entries: prevYear, isHistorical: true, sourceYear: year - 1 };
  return { entries: [], isHistorical: false, sourceYear: year };
}
function upcomingDividendPreview() {
  var now = new Date();
  var result = [];
  var cursorY = now.getFullYear(), cursorM = now.getMonth();
  var cal = dividendCalendar();
  var display = getMonthDividendDisplay(cal, cursorY, cursorM);
  result.push(Object.assign({ monthIndex: cursorM, year: cursorY }, display));
  cursorM++; if (cursorM > 11) { cursorM = 0; cursorY++; }
  var MAX_MONTHS = 5;
  while (result.length < MAX_MONTHS) {
    var ym = cursorY + '-' + String(cursorM + 1).padStart(2, '0');
    var actualEntries = cal[ym] || [];
    display = getMonthDividendDisplay(cal, cursorY, cursorM);
    result.push(Object.assign({ monthIndex: cursorM, year: cursorY }, display));
    if (actualEntries.length > 0) break;
    cursorM++; if (cursorM > 11) { cursorM = 0; cursorY++; }
  }
  return result;
}
function toggleDividendCalendar() { state.showDividendCalendar = !state.showDividendCalendar; render(); }
function changeCalendarYear(delta) { state.calendarYear += delta; render(); }
function receivedDividendByMonthForYear(year) {
  var map = receivedDividendByMonth();
  var out = {};
  Object.keys(map).forEach(function (ym) { if (ym.slice(0, 4) === String(year)) out[ym] = map[ym]; });
  return out;
}

function priceStatusFor(idealPrice, maxBuyZone, curPrice) {
  if (curPrice <= 0 || (idealPrice <= 0 && maxBuyZone <= 0)) return null;
  if (idealPrice > 0 && curPrice < idealPrice) return { label: 'Murah', color: '#2E7D32', bg: '#E3F5E7' };
  if (maxBuyZone > 0 && curPrice > maxBuyZone) return { label: 'Hold', color: '#C0392B', bg: '#F8E3E1' };
  return { label: 'Akumulasi', color: '#B8860B', bg: '#FBF1DC' };
}
function priceBarFor(idealPrice, maxBuyZone, curPrice) {
  if (curPrice <= 0 || (idealPrice <= 0 && maxBuyZone <= 0)) return null;
  var barMin, barMax;
  if (idealPrice > 0 && maxBuyZone > 0) {
    var span = Math.max(maxBuyZone - idealPrice, 1);
    barMin = Math.max(idealPrice - span * 0.5, 0); barMax = maxBuyZone + span * 0.5;
  } else if (idealPrice > 0) { barMin = idealPrice * 0.7; barMax = idealPrice * 1.3; }
  else { barMin = maxBuyZone * 0.7; barMax = maxBuyZone * 1.3; }
  var span2 = barMax - barMin || 1;
  function pctOf(v) { return Math.min(Math.max(((v - barMin) / span2) * 100, 0), 100); }
  return { idealPct: idealPrice > 0 ? pctOf(idealPrice) : null, maxPct: maxBuyZone > 0 ? pctOf(maxBuyZone) : null, curPct: pctOf(curPrice) };
}

      '<div><label class="field-label">Tanggal</label><input class="input" type="date" value="' + state.stockDate + '" onchange="state.stockDate=this.value" /></div>' +
      '</div>';
  }

  html += '<div class="mb-2"><label class="field-label">Catatan</label><input class="input" id="stockNoteInput" value="' + escapeHtml(state.stockNote) + '" oninput="state.stockNote=this.value" /></div>';
  if (state.stockType !== 'dividend') {
    html += '<div class="mb-2"><label class="field-label">Alasan/Tesis (opsional, buat jurnal)</label><textarea class="input" rows="2" id="stockThesisInput" oninput="state.stockThesis=this.value">' + escapeHtml(state.stockThesis) + '</textarea></div>';
  }
  if (state.stockFormError) html += '<p class="error-text">' + escapeHtml(state.stockFormError) + '</p>';
  html += '<button class="btn btn-primary btn-block" onclick="submitStockTx()">' + ICONS.check + ' ' + (state.stockTxEditingId ? 'Update Transaksi' : 'Simpan Transaksi') + '</button></div>';
  return html;
}
function renderStockTxHistory() {
  var sorted = state.stockTx.slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
  if (sorted.length === 0) return '<div class="empty-state">Belum ada transaksi saham.</div>';
  var label = { buy: 'Beli', sell: 'Jual', dividend: 'Dividen' };
  var rows = sorted.map(function (t) {
    var desc = t.type === 'dividend' ? formatRupiah(t.price) + '/lbr' : (t.shares + ' lbr @ ' + formatRupiah(t.price));
    var statusHtml = '';
    if (t.type === 'dividend') {
      var sc = t.dividendStatus === 'sudah' ? 'var(--income)' : t.dividendStatus === 'terlewat' ? 'var(--ink-soft)' : 'var(--expense)';
      var sl = t.dividendStatus === 'sudah' ? 'Sudah Diterima' : t.dividendStatus === 'terlewat' ? 'Terlewat' : 'Belum Diterima';
      statusHtml = '<div class="text-xs" style="color:' + sc + ';font-weight:600;">' + sl + '</div>';
    } else if (t.type === 'buy' && t.capitalSource && t.capitalSource !== 'new') {
      statusHtml = '<div class="text-xs" style="color:var(--primary);font-weight:600;">Reinvest' + (t.extraKasTxId ? ' + Modal Baru' : '') + '</div>';
    }
    return '<tr><td class="text-xs" style="white-space:nowrap;">' + formatDMY(t.date).slice(0, 5) + '</td>' +
      '<td><b>' + escapeHtml(t.ticker) + '</b><div class="text-xs ink-soft">' + label[t.type] + '</div>' + statusHtml + '</td>' +
      '<td class="text-xs" style="text-align:right;">' + desc + (t.thesis ? ('<div class="text-xs ink-soft" style="font-style:italic;max-width:120px;">' + escapeHtml(t.thesis) + '</div>') : '') + '</td>' +
      '<td style="text-align:right;white-space:nowrap;"><button class="icon-btn" onclick="editStockTx(\'' + t.id + '\')">' + ICONS.pencil + '</button>' +
      '<button class="icon-btn" onclick="deleteStockTx(\'' + t.id + '\')">' + ICONS.trash + '</button></td></tr>';
  }).join('');
  return '<div class="table-wrap" style="max-height:280px;"><table><tbody>' + rows + '</tbody></table></div>';
}
function renderStockTxModal() {
  if (!state.showStockTxModal) return '';
  return '<div class="modal-overlay" onclick="toggleStockTxModal()"><div class="modal-box" style="max-width:460px;max-height:85vh;overflow:auto;" onclick="event.stopPropagation()">' +
    '<div class="row-between mb-2"><div class="font-display" style="font-size:18px;">' + ICONS.coins + ' Transaksi Saham</div>' +
    '<button class="icon-btn" onclick="toggleStockTxModal()" style="opacity:1;">' + ICONS.x + '</button></div>' +
    renderStockForm() +
    '<p class="text-xs mb-2" style="font-weight:500;">Riwayat Transaksi Saham</p>' +
    renderStockTxHistory() +
    '</div></div>';
}

/* ================= RENDER: Target Portofolio ================= */
function statusForPct(pctRaw) {
  if (pctRaw > 75) return { label: 'Bertumbuh', color: '#4CAF50' };
  if (pctRaw >= 35) return { label: 'Penguatan', color: '#F2B705' };
  return { label: 'Tahap Awal', color: '#3B82F6' };
}
function renderAllocationDonut() {
  var data = targetAllocationData();
  if (data.length === 0) return '';
  var cum = 0;
  var stops = data.map(function (r) {
    var start = cum, end = cum + r.pct; cum = end;
    return r.color + ' ' + start.toFixed(2) + '% ' + end.toFixed(2) + '%';
  }).join(', ');
  var legend = data.map(function (r) {
    return '<div class="text-xs" style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:' + r.color + ';flex-shrink:0;"></span>' +
      '<span>' + escapeHtml(r.ticker) + '</span><b class="mono">' + r.pct.toFixed(1) + '%</b></div>';
  }).join('');
  return '<div style="display:flex;align-items:center;gap:12px;margin-top:8px;">' +
    '<div style="width:90px;height:90px;border-radius:50%;background:conic-gradient(' + stops + ');flex-shrink:0;position:relative;">' +
    '<div style="position:absolute;inset:18px;border-radius:50%;background:var(--card);"></div></div>' +
    '<div style="display:flex;flex-direction:column;gap:3px;">' + legend + '</div></div>';
}
function renderTargetForm() {
  var sm = sortedStockMaster();
  var opts = sm.map(function (m) { return '<option value="' + escapeHtml(m.ticker) + '" ' + (m.ticker === state.targetTicker ? 'selected' : '') + '>' + escapeHtml(m.ticker) + ' (P' + (m.priority || '1') + ')</option>'; }).join('');
  return '<div class="card-pad" style="border-top:1px solid var(--line);">' +
    '<div class="mb-2"><label class="field-label">Emiten</label><select class="input" id="targetTickerSelect" onchange="state.targetTicker=this.value">' + opts + '</select></div>' +
    '<div class="mb-2"><label class="field-label">Target Lot</label><input class="input" type="number" id="targetLotInput" value="' + escapeHtml(state.targetLot) + '" oninput="state.targetLot=this.value" /></div>' +
    (state.targetFormError ? '<p class="error-text">' + escapeHtml(state.targetFormError) + '</p>' : '') +
    '<button class="btn btn-primary btn-block" onclick="submitTarget()">' + ICONS.check + ' ' + (state.targetEditingId ? 'Update Target' : 'Simpan Target') + '</button></div>';
}
function renderTargetCard() {
  var tp = targetsWithProgress();
  var rows = '';
  var lastTier = null;
  tp.forEach(function (t) {
    var tier = t.tier || '1';
    if (tier !== lastTier) {
      rows += '<div class="text-sm" style="font-weight:700;background:var(--bg);padding:6px 16px;">Prioritas ' + tier + ' - ' + (PRIORITY_LABELS[tier] || '') + '</div>';
      lastTier = tier;
    }
    var st = statusForPct(t.pctRaw);
    rows += '<div class="loan-row" style="background:' + (t.actualLot > 0 ? 'transparent' : '#EAF2FB') + ';">' +
      '<div class="row-between mb-1"><div class="text-sm" style="font-weight:600;">' + escapeHtml(t.ticker) + '<span class="text-xs ink-soft" style="font-weight:400;"> (' + (t.market === 'idx' ? 'IDX' : 'US') + ')</span></div>' +
      '<div style="display:flex;align-items:center;gap:6px;"><span class="text-xs" style="font-weight:700;color:' + st.color + ';">' + st.label + '</span>' +
      '<button class="icon-btn" onclick="editTarget(\'' + t.id + '\')">' + ICONS.pencil + '</button>' +
      '<button class="icon-btn" onclick="deleteTarget(\'' + t.id + '\')">' + ICONS.trash + '</button></div></div>' +
      '<div class="text-xs ink-soft mb-1">Aktual ' + (t.actualLot % 1 === 0 ? t.actualLot : t.actualLot.toFixed(1)) + ' / Target ' + t.targetLot + ' lot (' + t.pctRaw.toFixed(0) + '%)</div>' +
      '<div style="height:6px;background:var(--bg);border-radius:999px;overflow:hidden;"><div style="height:6px;width:' + t.pct + '%;background:' + st.color + ';"></div></div>' +
      '</div>';
  });
  return '<div class="card">' +
    '<div class="card-head"><div class="card-title">' + ICONS.wallet + ' Target Portofolio</div>' +
    '<button class="btn btn-soft-income btn-sm" onclick="toggleTargetForm()">' + (state.showTargetForm ? (ICONS.x + ' Tutup') : (ICONS.plus + ' Tambah')) + '</button></div>' +
    (state.showTargetForm ? renderTargetForm() : '') +
    (tp.length === 0 ? '<div class="empty-state">Belum ada target portofolio.</div>' : rows) +
    '<div class="card-pad" style="border-top:1px solid var(--line);">' +
    '<p class="text-xs" style="font-weight:500;margin-bottom:4px;">Grafik Porsi Alokasi (posisi aktual)</p>' +
    (targetAllocationData().length === 0 ? '<p class="text-xs ink-soft">Belum ada emiten yang dimiliki.</p>' : renderAllocationDonut()) +
    '</div></div>';
}

/* ================= RENDER: Kalender Dividen ================= */
function renderDividendEntryLine(t, isHistorical, sourceYear) {
  if (isHistorical) {
    return '<div class="text-xs" style="color:#DC2626;font-weight:600;">' + escapeHtml(t.ticker) + ' <span style="font-weight:400;opacity:.75;">(' + sourceYear + ')</span></div>';
  }
  var kasTx = state.transactions.find(function (tx) { return tx.id === t.kasTxId; });
  var amt = kasTx ? kasTx.amount : t.shares * t.price;
  var color = t.dividendStatus === 'sudah' ? 'var(--income)' : t.dividendStatus === 'terlewat' ? 'var(--ink-soft)' : 'var(--expense)';
  return '<div class="row-between text-xs" style="padding:2px 0;"><span style="font-weight:600;color:' + color + ';">' + escapeHtml(t.ticker) + '</span>' +
    '<span class="mono" style="color:' + color + ';font-weight:600;">' + formatRupiah(amt) + '</span></div>';
}
function renderDividendCalendarCard() {
  var preview = upcomingDividendPreview();
  var previewHtml = preview.map(function (m) {
    var monthLabel = MONTH_NAMES[m.monthIndex] + ' ' + m.year;
    var body = m.entries.length === 0 ? '<div class="text-xs ink-soft" style="font-style:italic;">Tidak ada pembagian dividen.</div>' :
      m.entries.map(function (t) { return renderDividendEntryLine(t, m.isHistorical, m.sourceYear); }).join('');
    return '<div class="mb-2"><div class="text-xs" style="font-weight:600;">' + monthLabel + '</div>' + body +
      (m.isHistorical ? ('<div class="text-xs" style="color:#DC2626;opacity:.75;font-style:italic;">Estimasi dari ' + m.sourceYear + '</div>') : '') + '</div>';
  }).join('');

  var yearHtml = '';
  if (state.showDividendCalendar) {
    var cal = dividendCalendar();
    var received = receivedDividendByMonthForYear(state.calendarYear);
    var yearTotal = 0, monthsWithData = 0;
    Object.keys(received).forEach(function (ym) { yearTotal += received[ym]; if (received[ym] > 0) monthsWithData++; });
    var yearAvg = monthsWithData > 0 ? yearTotal / monthsWithData : 0;
    var months = '';
    for (var mi = 0; mi < 12; mi++) {
      var ym = state.calendarYear + '-' + String(mi + 1).padStart(2, '0');
      var display = getMonthDividendDisplay(cal, state.calendarYear, mi);
      var total = received[ym] || 0;
      months += '<div style="background:var(--bg);border-radius:8px;padding:8px;">' +
        '<div class="row-between" style="border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px;"><span class="text-xs" style="font-weight:600;">' + MONTH_NAMES[mi] + '</span>' +
        (total > 0 ? ('<span class="mono text-xs" style="color:var(--income);font-weight:700;">' + formatRupiah(total) + '</span>') : '') + '</div>' +
        (display.entries.length === 0 ? '<div class="text-xs ink-soft" style="font-style:italic;">Kosong</div>' :
          display.entries.map(function (t) { return renderDividendEntryLine(t, display.isHistorical, display.sourceYear); }).join('') +
          (display.isHistorical ? '<div class="text-xs" style="color:#DC2626;opacity:.75;">Estimasi ' + display.sourceYear + '</div>' : '')) +
        '</div>';
    }
    yearHtml = '<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px;">' +
      '<div class="row-between mb-1"><button class="btn btn-outline btn-sm" onclick="changeCalendarYear(-1)">&lsaquo; ' + (state.calendarYear - 1) + '</button>' +
      '<div class="text-sm" style="font-weight:700;">' + state.calendarYear + '</div>' +
      '<button class="btn btn-outline btn-sm" onclick="changeCalendarYear(1)">' + (state.calendarYear + 1) + ' &rsaquo;</button></div>' +
      '<div class="text-center text-xs ink-soft mb-2">Total diterima tahun ini: <b class="mono" style="color:var(--income);">' + formatRupiah(yearTotal) + '</b>' +
      ' &middot; Rata-rata/bulan: <b class="mono" style="color:var(--income);">' + formatRupiah(yearAvg) + '</b></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' + months + '</div>' +
      '<div style="border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;" class="text-xs ink-soft">' +
      '<b>Keterangan:</b> <span style="color:#2E7D32;">&#9679;</span> Sudah Diterima &middot; <span style="color:var(--expense);">&#9679;</span> Belum Diterima &middot; <span style="color:var(--ink-soft);">&#9679;</span> Terlewat &middot; <span style="color:#DC2626;">&#9679;</span> Estimasi tahun lalu' +
      '</div></div>';
  }
  return '<div class="card"><div class="card-pad">' +
    '<div class="card-title mb-2">' + ICONS.wallet + ' Dividen Mendatang</div>' +
    previewHtml +
    '</div>' +
    '<button class="card-head" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;" onclick="toggleDividendCalendar()">' +
    '<span class="text-sm" style="font-weight:500;">Kalender Dividen Setahun</span>' +
    '<span class="text-xs ink-soft" style="display:flex;align-items:center;gap:6px;">' + ICONS.chevron + '</span></button>' +
    (state.showDividendCalendar ? ('<div class="card-pad">' + yearHtml + '</div>') : '') +
    '</div>';
}

/* ================= RENDER: Backup & Restore ================= */
function backupPayloadString() {
  var payload = Object.assign({ version: 1, exportedAt: new Date().toISOString() }, currentDataForSave());
  return JSON.stringify(payload, null, 2);
}
function toggleBackupPanel() { state.showBackupPanel = !state.showBackupPanel; render(); }
function downloadBackup() {
  var blob = new Blob([backupPayloadString()], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'kas-harian-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function copyBackup() {
  navigator.clipboard.writeText(backupPayloadString()).then(function () {
    state.backupMsg = 'Berhasil disalin ke clipboard.'; render();
  }).catch(function () { state.backupMsg = 'Gagal menyalin, coba unduh saja.'; render(); });
}
function handleRestoreFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var obj = JSON.parse(e.target.result);
      if (!isValidBackup(obj)) { state.restoreMsg = 'File tidak valid.'; render(); return; }
      state.pendingRestore = obj; render();
    } catch (err) { state.restoreMsg = 'Gagal membaca file.'; render(); }
  };
  reader.readAsText(file);
}
function restoreFromText() {
  try {
    var obj = JSON.parse(state.restoreText);
    if (!isValidBackup(obj)) { state.restoreMsg = 'Teks tidak valid.'; render(); return; }
    state.pendingRestore = obj; render();
  } catch (e) { state.restoreMsg = 'Gagal membaca teks.'; render(); }
}
function cancelRestore() { state.pendingRestore = null; render(); }
function confirmRestore() {
  applyLoadedData(state.pendingRestore);
  state.pendingRestore = null;
  state.restoreText = ''; state.restoreMsg = 'Data berhasil dipulihkan.';
  saveData(); render();
}
function renderRestoreModal() {
  if (!state.pendingRestore) return '';
  var p = state.pendingRestore;
  var txCount = (p.transactions || []).length;
  return '<div class="modal-overlay"><div class="modal-box">' +
    '<div class="font-display" style="font-size:18px;margin-bottom:8px;">Pulihkan data ini?</div>' +
    '<p class="text-sm ink-soft mb-1">Backup berisi <b style="color:var(--ink);">' + txCount + ' transaksi</b>.</p>' +
    '<p class="text-sm mb-3" style="color:var(--expense);">Data yang ada sekarang akan ditimpa.</p>' +
    '<div style="display:flex;gap:8px;"><button class="btn btn-outline flex-1" onclick="cancelRestore()">Batal</button>' +
    '<button class="btn flex-1" style="background:var(--expense);color:#fff;" onclick="confirmRestore()">Ya, Timpa Data</button></div>' +
    '</div></div>';
}
function renderBackupCard() {
  return '<div class="card">' +
    '<button class="card-head" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;" onclick="toggleBackupPanel()">' +
    '<span class="card-title">' + ICONS.shield + ' Cadangkan &amp; Pulihkan Data</span>' +
    ICONS.chevron + '</button>' +
    (state.showBackupPanel ? ('<div class="card-pad">' +
      '<button class="btn btn-outline btn-block mb-2" onclick="downloadBackup()">' + ICONS.download + ' Unduh Backup</button>' +
      '<button class="btn btn-outline btn-block mb-2" onclick="copyBackup()">' + ICONS.copy + ' Salin ke Clipboard</button>' +
      (state.backupMsg ? '<p class="text-xs mb-2" style="color:var(--primary);">' + escapeHtml(state.backupMsg) + '</p>' : '') +
      '<label class="field-label">Pulihkan dari File</label>' +
      '<input type="file" accept="application/json" class="input mb-2" onchange="handleRestoreFile(this)" />' +
      '<label class="field-label">Atau Tempel Teks Backup</label>' +
      '<textarea class="input mb-2" rows="3" oninput="state.restoreText=this.value">' + escapeHtml(state.restoreText) + '</textarea>' +
      '<button class="btn btn-outline btn-block" onclick="restoreFromText()">' + ICONS.upload + ' Pulihkan dari Teks</button>' +
      (state.restoreMsg ? '<p class="text-xs mt-2">' + escapeHtml(state.restoreMsg) + '</p>' : '') +
      '<button class="btn btn-outline btn-block mt-2" style="color:var(--ink-soft);" onclick="gantiKodeAkses()">Ganti Kode Akses</button>' +
      '</div>') : '') +
    '</div>';
}

/* ================= MAIN RENDER ================= */
function render() {
  if (!accessCode) {
    document.getElementById('root').innerHTML = renderAccessGate();
    return;
  }
  var filtered = computeFiltered();
  var totals = computeTotals(filtered);

  var html = renderHeader(totals) +
    '<div class="content"><div class="container">' +
    renderFinancialHealth() +
    renderTallyCard() +
    renderReminderBanner() +
    renderTxForm() +
    renderRiwayat(filtered) +
    renderLoanLauncher() +
    renderTargetCard() +
    renderEmergencyCard() +
    renderVehicleLauncher() +
    renderMasterLauncher() +
    renderStockTxLauncher() +
    renderDividendCalendarCard() +
    renderBackupCard() +
    '</div></div>' +
    renderRestoreModal() +
    renderVehicleModal() +
    renderLoanModal() +
    renderMasterModal() +
    renderStockTxModal();

  var rootEl = document.getElementById('root');
  rootEl.innerHTML = html;
  // Paksa browser reflow/repaint langsung (beberapa webview HP kadang telat nampilin
  // perubahan DOM sampai ada interaksi lain -- baca offsetHeight memaksa recalculate,
  // requestAnimationFrame sebagai lapisan kedua biar makin pasti kepaint).
  void rootEl.offsetHeight;
  if (window.requestAnimationFrame) {
    requestAnimationFrame(function () { void rootEl.offsetHeight; });
  }
}

/* ================= Init ================= */
document.addEventListener('DOMContentLoaded', function () {
  loadData();
  render();
  if (accessCode) initCloudSync();
});
</script>
