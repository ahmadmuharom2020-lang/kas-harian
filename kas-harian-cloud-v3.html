<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>Tenang Finance - Project Tenang</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg:#F6F3EC; --card:#FFFFFF; --ink:#1E2A28; --ink-soft:#5B6663;
    --primary:#2C4A43; --primary-dark:#1B302B; --income:#A8791F; --income-bg:#FBF1DC;
    --expense:#8B3A3A; --expense-bg:#F8E9E7; --line:#DED7C7; --danger:#E11D2E;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); }
  body { color:var(--ink); font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif; padding-bottom:48px; }
  .font-display { font-family:'Fraunces', Georgia, serif; }
  .mono { font-family:'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }

  .container { max-width: 640px; margin:0 auto; padding: 0 20px; }

  .app-header { background: var(--primary); color:#fff; padding: 20px 0 16px; }
  .eyebrow { font-size:12px; letter-spacing:.15em; text-transform:uppercase; opacity:.7; margin:0 0 2px; }
  .title { font-size:24px; margin:0 0 12px; color:#F3E9C7; }

  .pill-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .pill { border:none; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:500; cursor:pointer; background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .save-indicator { font-size:12px; opacity:.6; }

  .stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .stat-box { border-radius:12px; padding:8px; background:rgba(255,255,255,0.08); min-width:0; }
  .stat-box.highlight { background:#F3E9C7; color:var(--primary-dark); }
  .stat-label { display:flex; align-items:center; gap:4px; font-size:11px; opacity:.7; margin-bottom:2px; }
  .stat-value { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .content { margin-top: -8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:12px; overflow:hidden; }
  .card-pad { padding:12px 16px; }
  .card-head { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }

  .banner-danger { background:var(--danger); color:#fff; border-radius:18px; padding:16px; margin-bottom:12px; }
  .banner-danger .head { display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:12px; }
  .banner-danger .item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid rgba(255,255,255,0.25); }
  .banner-danger .item:first-child { border-top:none; }
  .banner-danger .name { font-weight:600; font-size:14px; }
  .banner-danger .meta { font-size:12px; opacity:.9; }
  .btn-white { background:#fff; color:var(--danger); border:none; font-weight:600; font-size:12px; padding:6px 12px; border-radius:10px; cursor:pointer; flex-shrink:0; }

  .btn { border:none; border-radius:10px; font-size:14px; cursor:pointer; padding:10px 14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-block { width:100%; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-outline { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-soft-income { background:var(--income-bg); color:var(--income); }
  .btn-soft-expense { background:var(--expense-bg); color:var(--expense); }
  .btn-sm { font-size:12px; padding:6px 10px; border-radius:8px; }
  .btn:disabled { background:var(--bg); color:var(--ink-soft); cursor:not-allowed; }

  .icon-btn { background:none; border:none; cursor:pointer; opacity:.4; padding:2px; color:var(--ink); }
  .icon-btn:hover { opacity:1; }

  .chip-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center; }
  .chip { border:none; border-radius:10px; padding:6px 10px; font-size:13px; font-weight:500; background:var(--income-bg); color:var(--income); cursor:pointer; }

  .digit-box { background:var(--primary-dark); color:#F3E9C7; border-radius:8px; padding:3px 7px; font-size:13px; font-weight:600; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), inset 0 -1px 0 rgba(255,255,255,0.08); }

  .row-between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .text-xs { font-size:12px; }
  .text-sm { font-size:14px; }
  .ink-soft { color:var(--ink-soft); }
  .mb-1 { margin-bottom:4px; } .mb-2 { margin-bottom:8px; } .mb-3 { margin-bottom:12px; }
  .mt-1 { margin-top:4px; } .mt-2 { margin-top:8px; }

  label.field-label { font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .input, select.input, textarea.input {
    width:100%; padding:8px 10px; border-radius:10px; border:1px solid var(--line); font-size:14px; font-family:inherit; background:#fff; color:var(--ink);
  }
  textarea.input { resize:vertical; }
  .input.error { border-color: var(--expense); }
  .form-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }

  .type-toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .type-toggle button { flex:1; border:none; background:transparent; padding:8px; font-size:14px; font-weight:500; cursor:pointer; color:var(--ink-soft); }
  .type-toggle button.active-income { background:var(--income-bg); color:var(--income); }
  .type-toggle button.active-expense { background:var(--expense-bg); color:var(--expense); }

  .error-text { font-size:12px; color:var(--expense); margin-bottom:8px; }

  .table-wrap { overflow:auto; max-height:340px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:500; font-size:12px; color:var(--ink-soft); padding:8px 16px; }
  td { padding:8px 16px; border-top:1px solid var(--line); vertical-align:middle; }
  .amount-income { color:var(--income); font-weight:500; }
  .amount-expense { color:var(--expense); font-weight:500; }
  .empty-state { padding:24px; text-align:center; font-size:14px; color:var(--ink-soft); }
  .row-income { background:#DFF5E3; }

  .loan-row { padding:12px 16px; border-top:1px solid var(--line); }
  .loan-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .loan-stat-box { border-radius:10px; padding:8px; background:var(--bg); }
  .badge-paid { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--income-bg); color:var(--income); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center; padding:16px; z-index:50; }
  .modal-box { width:100%; max-width:380px; background:#fff; border-radius:18px; padding:20px; }

  .hidden { display:none !important; }
  .flex-1 { flex:1; }
  .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  svg.icon { flex-shrink:0; vertical-align:middle; }

<script>
/* ================================================================
   TENANG FINANCE - versi standalone (Tahap 1+2)
   Cakupan yang SUDAH ada di file ini:
     - Kas Harian (catat transaksi, riwayat collapsible, filter Hari Ini/Bulan/Semua)
     - Kesehatan Finansial (skor ringkas 1 baris)
     - Tally Tip
     - Reminder terpadu: Pinjaman jatuh tempo + Perawatan Kendaraan
     - Pinjaman (Tunai/Barang, sisa uang tunai terlacak, "Sumber Dana" di form transaksi)
     - Dana Darurat (target otomatis 6 bulan pengeluaran, nabung/tarik)
     - Perawatan Kendaraan (multi-jenis, dasar - belum ada "buku riwayat servis" penuh)
     - Backup & Restore

   BELUM ada di file ini (menyusul di sesi berikutnya):
     - Data Saham, Transaksi Saham, Target Portofolio, Kalender Dividen
     - Kalkulator Saham, Kalkulator Zakat Maal, Jurnal Investasi
     - Budget Kategori, Riwayat Nilai Portofolio (grafik), Arsip & Laporan Tahunan
   ================================================================ */

/* ================= Helpers ================= */
var STORAGE_KEY = 'kas-harian-store-v1';
var ACCESS_CODE_KEY = 'kas-harian-access-code';
var accessCode = localStorage.getItem(ACCESS_CODE_KEY) || '';

var DEFAULT_CATEGORIES = {
  income: ['Tarif Order', 'Tip', 'Bonus Mitra'],
  expense: ['Bensin', 'Ganti Oli', 'Makan', 'Parkir', 'Servis Motor', 'Pulsa/Data', 'Lainnya']
};
var TIP_PRESETS = [2000, 5000, 10000];

function todayStr() {
  var d = new Date();
  var off = d.getTimezoneOffset();
  var local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
}
function formatRupiah(n) {
  n = n || 0;
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function formatDMY(dateStr) {
  if (!dateStr) return '-';
  var parts = dateStr.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function daysUntil(dateStr) {
  var target = new Date(dateStr + 'T00:00:00');
  var today = new Date(todayStr() + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function addMonths(dateStr, n) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(parts[0], parts[1] - 1 + n, parts[2]);
  var yy = dt.getFullYear();
  var mm = String(dt.getMonth() + 1).padStart(2, '0');
  var dd = String(dt.getDate()).padStart(2, '0');
  return yy + '-' + mm + '-' + dd;
}
function addDays(dateStr, n) {
  var dt = new Date(dateStr + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  var yy = dt.getFullYear();
  var mm = String(dt.getMonth() + 1).padStart(2, '0');
  var dd = String(dt.getDate()).padStart(2, '0');
  return yy + '-' + mm + '-' + dd;
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function mergeTipIntoTransactions(txs, date, amountToAdd) {
  var idx = -1;
  for (var i = 0; i < txs.length; i++) {
    if (txs[i].type === 'income' && txs[i].category === 'Tip' && txs[i].date === date) { idx = i; break; }
  }
  if (idx >= 0) {
    var updated = txs.slice();
    updated[idx] = Object.assign({}, updated[idx], { amount: updated[idx].amount + amountToAdd });
    return updated;
  }
  return [{ id: uid(), date: date, type: 'income', category: 'Tip', note: 'Setoran tally tip harian', amount: amountToAdd, createdAt: Date.now() }].concat(txs);
}
function isValidBackup(obj) {
  return !!(obj && typeof obj === 'object' && Array.isArray(obj.transactions) && obj.categories &&
    Array.isArray(obj.categories.income) && Array.isArray(obj.categories.expense));
}

/* ================= Icons (SVG kecil, tanpa library luar) ================= */
function icon(paths, size) {
  size = size || 16;
  return '<svg class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
}
var ICONS = {
  plus: icon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  x: icon('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 12),
  check: icon('<polyline points="20 6 9 17 4 12"/>'),
  trash: icon('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>', 14),
  pencil: icon('<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>', 14),
  up: icon('<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>', 12),
  down: icon('<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>', 12),
  wallet: icon('<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>', 12),
  coins: icon('<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/>', 16),
  download: icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>', 14),
  upload: icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>', 14),
  copy: icon('<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', 14),
  shield: icon('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>', 16),
  chevron: icon('<polyline points="6 9 12 15 18 9"/>', 16),
  landmark: icon('<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/>', 16),
  alert: icon('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>', 18),
  wrench: icon('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>', 16),
  gauge: icon('<path d="M12 14 15 11"/><circle cx="12" cy="12" r="10"/><path d="M12 6v2M18 12h2M4 12h2"/>', 15)
};

/* ================= State ================= */
var state = {
  categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
  transactions: [],
  tally: { date: todayStr(), count: 0, total: 0 },
  loans: [],
  emergencyTx: [],
  vehicleMaintenanceTypes: [{ id: uid(), name: 'Ganti Oli', category: 'Ganti Oli', intervalDays: 15 }],
  filter: 'today',
  cloudStatus: 'idle',

  manualTipAmount: '',

  txType: 'income',
  txCategory: DEFAULT_CATEGORIES.income[0],
  txShowNewCat: false,
  txNewCatName: '',
  txAmount: '',
  txNote: '',
  txDate: todayStr(),
  txEditingId: null,
  txFormError: '',
  txSourceLoanId: '',

  showRiwayat: false,

  showLoanForm: false,
  loanEditingId: null,
  loanAppName: '',
  loanTenor: '',
  loanInstallment: '',
  loanDueDate: '',
  loanType: 'tunai',
  loanItemName: '',
  loanCashAmount: '',
  loanFormError: '',

  showEmergencyForm: false,
  showEmergencyHistory: false,
  emergencyEditingId: null,
  emergencyType: 'nabung',
  emergencyAmount: '',
  emergencyDate: todayStr(),
  emergencyNote: '',
  emergencyFormError: '',

  showVehicleModal: false,
  showLoanModal: false,
  showVehicleTypeForm: false,
  vehicleTypeName: '',
  vehicleTypeInterval: '',
  vehicleTypeFormError: '',

  showBackupPanel: false,
  backupMsg: '',
  restoreText: '',
  restoreMsg: '',
  pendingRestore: null
};

/* ================= Persistence ================= */
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    applyLoadedData(parsed);
    localUpdatedAt = parsed.updatedAt || 0;
  } catch (e) {
    console.error('Gagal memuat data', e);
  }
}
function applyLoadedData(parsed) {
  var cats = parsed.categories || DEFAULT_CATEGORIES;
  var txs = parsed.transactions || [];
  var tly = parsed.tally || { date: todayStr(), count: 0, total: 0 };
  var lns = Array.isArray(parsed.loans) ? parsed.loans : [];
  var etx = Array.isArray(parsed.emergencyTx) ? parsed.emergencyTx : [];
  var vmtRaw = Array.isArray(parsed.vehicleMaintenanceTypes) ? parsed.vehicleMaintenanceTypes : [];
  var vmt = vmtRaw.length > 0 ? vmtRaw : [{ id: uid(), name: 'Ganti Oli', category: 'Ganti Oli', intervalDays: 15 }];

  var today = todayStr();
  if (tly.date !== today) {
    if (tly.total > 0) txs = mergeTipIntoTransactions(txs, tly.date, tly.total);
    tly = { date: today, count: 0, total: 0 };
  }

  state.categories = cats;
  state.transactions = txs;
  state.tally = tly;
  state.loans = lns;
  state.emergencyTx = etx;
  state.vehicleMaintenanceTypes = vmt;
  state.txCategory = (cats.income && cats.income[0]) || DEFAULT_CATEGORIES.income[0];
}
var localUpdatedAt = 0;

function currentDataForSave() {
  return {
    categories: state.categories,
    transactions: state.transactions,
    tally: state.tally,
    loans: state.loans,
    emergencyTx: state.emergencyTx,
    vehicleMaintenanceTypes: state.vehicleMaintenanceTypes
  };
}
function saveData() {
  localUpdatedAt = Date.now();
  try {
    var payload = currentDataForSave();
    payload.updatedAt = localUpdatedAt;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.error('Gagal menyimpan data', e);
  }
  pushToCloud();
}

/* ================= Sinkronisasi Cloud (Firebase) ================= */
function setAccessCode() {
  var el = document.getElementById('accessCodeInput');
  var val = el ? el.value.trim() : '';
  if (!val) return;
  localStorage.setItem(ACCESS_CODE_KEY, val);
  accessCode = val;
  render();
  initCloudSync();
}
function gantiKodeAkses() {
  localStorage.removeItem(ACCESS_CODE_KEY);
  accessCode = '';
  state.cloudStatus = 'idle';
  render();
}
function applyRemoteData(cloud) {
  applyLoadedData(cloud);
  localUpdatedAt = cloud.updatedAt || Date.now();
  try {
    var payload = currentDataForSave();
    payload.updatedAt = localUpdatedAt;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {}
}
function initCloudSync() {
  if (!accessCode) return;
  if (!window.__fsDb) { state.cloudStatus = 'offline'; render(); return; }
  state.cloudStatus = 'connecting';
  render();
  var ref = window.__fsDoc(window.__fsDb, 'kas_harian', accessCode);
  window.__fsGetDoc(ref).then(function (snap) {
    if (snap.exists()) {
      var cloud = snap.data();
      var cloudUpdatedAt = cloud.updatedAt || 0;
      if (cloudUpdatedAt > localUpdatedAt) {
        // Cloud lebih baru dari data lokal (misal habis diedit dari HP lain) -> pakai data cloud
        applyRemoteData(cloud);
        state.cloudStatus = 'connected';
        render();
      } else {
        // Data lokal sama atau lebih baru -> jangan ditimpa. Kalau lokal lebih baru, dorong ke cloud biar sinkron.
        state.cloudStatus = 'connected';
        render();
        if (localUpdatedAt > cloudUpdatedAt) pushToCloud();
      }
    } else {
      var data = currentDataForSave();
      data.updatedAt = localUpdatedAt || Date.now();
      return window.__fsSetDoc(ref, data).then(function () { state.cloudStatus = 'connected'; render(); });
    }
  }).catch(function (e) {
    console.error('Gagal sinkron ke cloud', e);
    state.cloudStatus = 'offline';
    render();
  });
}
function pushToCloud() {
  if (!accessCode || !window.__fsDb) return;
  var ref = window.__fsDoc(window.__fsDb, 'kas_harian', accessCode);
  var data = currentDataForSave();
  data.updatedAt = localUpdatedAt || Date.now();
  window.__fsSetDoc(ref, data).then(function () {
    state.cloudStatus = 'connected';
    render();
  }).catch(function (e) {
    console.error('Gagal push ke cloud', e);
    state.cloudStatus = 'offline';
    render();
  });
}

/* ================= Kesehatan Finansial ================= */
function avgMonthlyExpense3mo() {
  var now = new Date();
  var totalSum = 0, monthsWithData = 0;
  for (var i = 0; i < 3; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var y = d.getFullYear(), m = d.getMonth();
    var monthTotal = state.transactions.filter(function (t) { return t.type === 'expense'; })
      .filter(function (t) { var td = new Date(t.date + 'T00:00:00'); return td.getFullYear() === y && td.getMonth() === m; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
    if (monthTotal > 0) { totalSum += monthTotal; monthsWithData++; }
  }
  return monthsWithData > 0 ? totalSum / monthsWithData : 0;
}
function avgMonthlyIncome3mo() {
  var now = new Date();
  var totalSum = 0, monthsWithData = 0;
  for (var i = 0; i < 3; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var y = d.getFullYear(), m = d.getMonth();
    var monthTotal = state.transactions.filter(function (t) { return t.type === 'income'; })
      .filter(function (t) { var td = new Date(t.date + 'T00:00:00'); return td.getFullYear() === y && td.getMonth() === m; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
    if (monthTotal > 0) { totalSum += monthTotal; monthsWithData++; }
  }
  return monthsWithData > 0 ? totalSum / monthsWithData : 0;
}
function emergencyBalance() {
  return state.emergencyTx.reduce(function (sum, t) { return sum + (t.type === 'nabung' ? t.amount : -t.amount); }, 0);
}
function emergencyTargetAuto() {
  return avgMonthlyExpense3mo() * 6;
}
function financialHealth() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var monthTx = state.transactions.filter(function (t) { var d = new Date(t.date + 'T00:00:00'); return d.getFullYear() === y && d.getMonth() === m; });
  var income = monthTx.filter(function (t) { return t.type === 'income'; }).reduce(function (s, t) { return s + t.amount; }, 0);
  var expense = monthTx.filter(function (t) { return t.type === 'expense'; }).reduce(function (s, t) { return s + t.amount; }, 0);
  var savingsRate = income > 0 ? ((income - expense) / income) * 100 : (expense > 0 ? -100 : null);

  var incomeBase = avgMonthlyIncome3mo() > 0 ? avgMonthlyIncome3mo() : income;
  var activeLoans = state.loans.filter(function (l) { return (l.tenorPaid || 0) < l.tenor; });
  var monthlyInstallment = activeLoans.reduce(function (s, l) { return s + l.installmentAmount; }, 0);
  var debtRatio = incomeBase > 0 ? (monthlyInstallment / incomeBase) * 100 : (monthlyInstallment > 0 ? 999 : 0);

  var emBal = emergencyBalance();
  var avgExp = avgMonthlyExpense3mo();
  var emergencyMonthsCovered = avgExp > 0 ? emBal / avgExp : null;

  var savingsScore = savingsRate === null ? 12 : savingsRate >= 20 ? 25 : savingsRate >= 10 ? 18 : savingsRate >= 0 ? 10 : 0;
  var debtScore = debtRatio <= 20 ? 25 : debtRatio <= 36 ? 18 : debtRatio <= 43 ? 10 : 0;
  var emergencyScore = emergencyMonthsCovered === null ? 12 : emergencyMonthsCovered >= 6 ? 25 : emergencyMonthsCovered >= 3 ? 18 : emergencyMonthsCovered >= 1 ? 10 : 0;
  var portfolioScore = 12; // modul saham belum ada di versi ini

  var score = Math.round(savingsScore + debtScore + emergencyScore + portfolioScore);
  var status, color, bg;
  if (score >= 70) { status = 'Sehat'; color = 'var(--primary)'; bg = '#E3EFE9'; }
  else if (score >= 40) { status = 'Perlu Perhatian'; color = '#A8791F'; bg = 'var(--income-bg)'; }
  else { status = 'Waspada'; color = 'var(--expense)'; bg = 'var(--expense-bg)'; }

  var tips = [];
  if (savingsScore <= 10) tips.push(income > 0 ? 'Tekan pengeluaran non-esensial' : 'Belum ada pemasukan tercatat bulan ini');
  if (debtScore <= 10) tips.push('Hindari menambah utang baru dulu');
  if (emergencyScore <= 10) tips.push('Prioritaskan menabung dana darurat');
  if (tips.length === 0) tips.push('Semua indikator baik, pertahankan!');

  return { score: score, status: status, color: color, bg: bg, tips: tips };
}
function renderFinancialHealth() {
  var fh = financialHealth();
  return '<div class="fh-banner" style="background:' + fh.bg + ';">' +
    '<div class="fh-line1" style="color:' + fh.color + ';">' + ICONS.gauge +
    '<span style="font-weight:700;font-size:14px;">' + fh.status + '</span>' +

    '</div>';
}

      '<td class="mono text-xs ' + (t.type === 'income' ? 'amount-income' : 'amount-expense') + '" style="text-align:right;">' + (t.type === 'income' ? '+' : '-') + formatRupiah(t.amount) + '</td>' +

    var isFinished = sisaAngsuran === 0;

    var statusText = isFinished ? '' : (d < 0 ? ('Lewat ' + Math.abs(d) + ' hari') : d === 0 ? 'Jatuh tempo hari ini' : '');

    return '<div class="loan-row">' +
      '<div class="row-between mb-1"><div class="text-sm" style="font-weight:600;">' + escapeHtml(loan.appName) + (isFinished ? ' <span class="badge-paid">Lunas</span>' : '') + '</div>' +
      '<div><button class="icon-btn" onclick="editLoan(\'' + loan.id + '\')">' + ICONS.pencil + '</button><button class="icon-btn" onclick="deleteLoan(\'' + loan.id + '\')">' + ICONS.trash + '</button></div></div>' +
      '<div class="text-xs ink-soft">Sisa angsuran: ' + sisaAngsuran + '/' + loan.tenor + ' bulan' + (!isFinished ? (' &middot; jatuh tempo ' + formatDMY(loan.dueDate)) : '') + '</div>' +
      (loan.loanType ? ('<div class="text-xs ink-soft mt-1">' + (loan.loanType === 'barang' ? ('Barang: ' + escapeHtml(loan.itemName || '-')) : ('Tunai: ' + formatRupiah(loan.cashAmount || 0) + ' diterima')) + '</div>') : '') +

      (statusText ? '<div class="text-xs mt-1" style="font-weight:600;color:var(--expense);">' + statusText + '</div>' : '') +

  return '<button class="card row-between" style="width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;" onclick="toggleVehicleModal()">' +
    '<span class="card-title">' + ICONS.wrench + ' Perawatan Kendaraan</span>' +
    '<span class="text-xs" style="color:' + (mr.length > 0 ? 'var(--expense)' : 'var(--ink-soft)') + ';">' + (mr.length > 0 ? (mr.length + ' jatuh tempo') : (state.vehicleMaintenanceTypes.length + ' jenis')) + '</span>' +
    '</button>';
}

/* ================= RENDER: Backup & Restore ================= */
function backupPayloadString() {
  var payload = Object.assign({ version: 1, exportedAt: new Date().toISOString() }, currentDataForSave());
  return JSON.stringify(payload, null, 2);
}
function toggleBackupPanel() { state.showBackupPanel = !state.showBackupPanel; render(); }
function downloadBackup() {
  var blob = new Blob([backupPayloadString()], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'kas-harian-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function copyBackup() {
  navigator.clipboard.writeText(backupPayloadString()).then(function () {
    state.backupMsg = 'Berhasil disalin ke clipboard.'; render();
  }).catch(function () { state.backupMsg = 'Gagal menyalin, coba unduh saja.'; render(); });
}
function handleRestoreFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var obj = JSON.parse(e.target.result);
      if (!isValidBackup(obj)) { state.restoreMsg = 'File tidak valid.'; render(); return; }
      state.pendingRestore = obj; render();
    } catch (err) { state.restoreMsg = 'Gagal membaca file.'; render(); }
  };
  reader.readAsText(file);
}
function restoreFromText() {
  try {
    var obj = JSON.parse(state.restoreText);
    if (!isValidBackup(obj)) { state.restoreMsg = 'Teks tidak valid.'; render(); return; }
    state.pendingRestore = obj; render();
  } catch (e) { state.restoreMsg = 'Gagal membaca teks.'; render(); }
}
function cancelRestore() { state.pendingRestore = null; render(); }
function confirmRestore() {
  applyLoadedData(state.pendingRestore);
  state.pendingRestore = null;
  state.restoreText = ''; state.restoreMsg = 'Data berhasil dipulihkan.';
  saveData(); render();
}
function renderRestoreModal() {
  if (!state.pendingRestore) return '';
  var p = state.pendingRestore;
  var txCount = (p.transactions || []).length;
  return '<div class="modal-overlay"><div class="modal-box">' +
    '<div class="font-display" style="font-size:18px;margin-bottom:8px;">Pulihkan data ini?</div>' +
    '<p class="text-sm ink-soft mb-1">Backup berisi <b style="color:var(--ink);">' + txCount + ' transaksi</b>.</p>' +
    '<p class="text-sm mb-3" style="color:var(--expense);">Data yang ada sekarang akan ditimpa.</p>' +
    '<div style="display:flex;gap:8px;"><button class="btn btn-outline flex-1" onclick="cancelRestore()">Batal</button>' +
    '<button class="btn flex-1" style="background:var(--expense);color:#fff;" onclick="confirmRestore()">Ya, Timpa Data</button></div>' +
    '</div></div>';
}
function renderBackupCard() {
  return '<div class="card"><div class="card-head"><div class="card-title">' + ICONS.shield + ' Backup & Restore</div></div>' +
    '<div class="card-pad">' +
    '<button class="btn btn-outline btn-block mb-2" onclick="downloadBackup()">' + ICONS.download + ' Unduh Backup</button>' +
    '<button class="btn btn-outline btn-block mb-2" onclick="copyBackup()">' + ICONS.copy + ' Salin ke Clipboard</button>' +
    (state.backupMsg ? '<p class="text-xs mb-2" style="color:var(--primary);">' + escapeHtml(state.backupMsg) + '</p>' : '') +
    '<label class="field-label">Pulihkan dari File</label>' +
    '<input type="file" accept="application/json" class="input mb-2" onchange="handleRestoreFile(this)" />' +
    '<label class="field-label">Atau Tempel Teks Backup</label>' +
    '<textarea class="input mb-2" rows="3" oninput="state.restoreText=this.value">' + escapeHtml(state.restoreText) + '</textarea>' +
    '<button class="btn btn-outline btn-block" onclick="restoreFromText()">' + ICONS.upload + ' Pulihkan dari Teks</button>' +
    (state.restoreMsg ? '<p class="text-xs mt-2">' + escapeHtml(state.restoreMsg) + '</p>' : '') +
    '<button class="btn btn-outline btn-block mt-2" style="color:var(--ink-soft);" onclick="gantiKodeAkses()">Ganti Kode Akses</button>' +
    '</div></div>';
}

/* ================= MAIN RENDER ================= */
function render() {
  if (!accessCode) {
    document.getElementById('root').innerHTML = renderAccessGate();
    return;
  }
  var filtered = computeFiltered();
  var totals = computeTotals(filtered);

  var html = renderHeader(totals) +
    '<div class="content"><div class="container">' +
    renderFinancialHealth() +
    renderTallyCard() +
    renderReminderBanner() +
    renderTxForm() +
    renderRiwayat(filtered) +
    renderLoanLauncher() +
    renderEmergencyCard() +
    renderVehicleLauncher() +
    renderBackupCard() +
    '</div></div>' +
    renderRestoreModal() +
    renderVehicleModal() +
    renderLoanModal();

  document.getElementById('root').innerHTML = html;
}

/* ================= Init ================= */
document.addEventListener('DOMContentLoaded', function () {
  loadData();
  render();
  if (accessCode) initCloudSync();
});
</script>
</body>
</html>
