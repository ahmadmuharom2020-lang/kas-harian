<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2C4A43" />
<title>Kas Harian - Project Tenang</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg:#F6F3EC; --card:#FFFFFF; --ink:#1E2A28; --ink-soft:#5B6663;
    --primary:#2C4A43; --primary-dark:#1B302B; --income:#A8791F; --income-bg:#FBF1DC;
    --expense:#8B3A3A; --expense-bg:#F8E9E7; --line:#DED7C7; --danger:#E11D2E;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); }
  body { color:var(--ink); font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif; padding-bottom:48px; }
  .font-display { font-family:'Fraunces', Georgia, serif; }
  .mono { font-family:'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }

  .container { max-width: 640px; margin:0 auto; padding: 0 20px; }

  .app-header { background: var(--primary); color:#fff; padding: 32px 0 24px; }
  .eyebrow { font-size:12px; letter-spacing:.15em; text-transform:uppercase; opacity:.7; margin:0 0 4px; }
  .title { font-size:30px; margin:0 0 16px; color:#F3E9C7; }

  .pill-row { display:flex; gap:8px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
  .pill { border:none; padding:6px 16px; border-radius:999px; font-size:14px; font-weight:500; cursor:pointer; background:rgba(255,255,255,0.12); color:#F3E9C7; }
  .pill.active { background:#F3E9C7; color:var(--primary-dark); }
  .save-indicator { font-size:12px; opacity:.6; }

  .stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .stat-box { border-radius:14px; padding:12px; background:rgba(255,255,255,0.08); min-width:0; }
  .stat-box.highlight { background:#F3E9C7; color:var(--primary-dark); }
  .stat-label { display:flex; align-items:center; gap:4px; font-size:12px; opacity:.7; margin-bottom:4px; }
  .stat-value { font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .content { margin-top: -12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:16px; overflow:hidden; }
  .card-pad { padding:16px; }
  .card-head { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
  .card-title { font-weight:500; display:flex; align-items:center; gap:8px; }

  .banner-danger { background:var(--danger); color:#fff; border-radius:18px; padding:16px; margin-bottom:16px; }
  .banner-danger .head { display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:12px; }
  .banner-danger .item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid rgba(255,255,255,0.25); }
  .banner-danger .item:first-child { border-top:none; }
  .banner-danger .name { font-weight:600; font-size:14px; }
  .banner-danger .meta { font-size:12px; opacity:.9; }
  .btn-white { background:#fff; color:var(--danger); border:none; font-weight:600; font-size:12px; padding:6px 12px; border-radius:10px; cursor:pointer; flex-shrink:0; }

  .btn { border:none; border-radius:10px; font-size:14px; cursor:pointer; padding:10px 14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-block { width:100%; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-outline { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-soft-income { background:var(--income-bg); color:var(--income); }
  .btn-soft-expense { background:var(--expense-bg); color:var(--expense); }
  .btn-sm { font-size:12px; padding:6px 10px; border-radius:8px; }
  .btn:disabled { background:var(--bg); color:var(--ink-soft); cursor:not-allowed; }

  .icon-btn { background:none; border:none; cursor:pointer; opacity:.4; padding:2px; color:var(--ink); }
  .icon-btn:hover { opacity:1; }

  .chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { border:none; border-radius:10px; padding:8px 12px; font-size:14px; font-weight:500; background:var(--income-bg); color:var(--income); cursor:pointer; }

  .digit-box { background:var(--primary-dark); color:#F3E9C7; border-radius:8px; padding:4px 8px; font-size:14px; font-weight:600; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), inset 0 -1px 0 rgba(255,255,255,0.08); }

  .row-between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .text-xs { font-size:12px; }
  .text-sm { font-size:14px; }
  .ink-soft { color:var(--ink-soft); }
  .mb-1 { margin-bottom:4px; } .mb-2 { margin-bottom:8px; } .mb-3 { margin-bottom:12px; }
  .mt-2 { margin-top:8px; }

  label.field-label { font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .input, select.input, textarea.input {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-size:14px; font-family:inherit; background:#fff; color:var(--ink);
  }
  textarea.input { resize:none; }
  .input.error { border-color: var(--expense); }
  .form-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }

  .type-toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .type-toggle button { flex:1; border:none; background:transparent; padding:10px; font-size:14px; font-weight:500; cursor:pointer; color:var(--ink-soft); }
  .type-toggle button.active-income { background:var(--income-bg); color:var(--income); }
  .type-toggle button.active-expense { background:var(--expense-bg); color:var(--expense); }

  .error-text { font-size:12px; color:var(--expense); margin-bottom:8px; }

  .table-wrap { overflow:auto; max-height:340px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:500; font-size:12px; color:var(--ink-soft); padding:8px 16px; }
  td { padding:8px 16px; border-top:1px solid var(--line); vertical-align:middle; }
  .amount-income { color:var(--income); font-weight:500; }
  .amount-expense { color:var(--expense); font-weight:500; }
  .empty-state { padding:24px; text-align:center; font-size:14px; color:var(--ink-soft); }

  .loan-row { padding:12px 16px; border-top:1px solid var(--line); }
  .loan-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .loan-stat-box { border-radius:10px; padding:8px; background:var(--bg); }
  .badge-paid { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--income-bg); color:var(--income); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center; padding:16px; z-index:50; }
  .modal-box { width:100%; max-width:380px; background:#fff; border-radius:18px; padding:20px; }

  .hidden { display:none !important; }
  .flex-1 { flex:1; }
  .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  svg.icon { flex-shrink:0; vertical-align:middle; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCewjm4yIH4tf0jnVOSzJ-Dno5atHr9L-g",
    authDomain: "kas-harian-ahmad.firebaseapp.com",
    projectId: "kas-harian-ahmad",
    storageBucket: "kas-harian-ahmad.firebasestorage.app",
    messagingSenderId: "474351105172",
    appId: "1:474351105172:web:8de81c5d0bf88abfa93081",
    measurementId: "G-3NGSPQ87P6"
  };

  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);

  window.__fsDb = db;
  window.__fsDoc = doc;
  window.__fsGetDoc = getDoc;
  window.__fsSetDoc = setDoc;
</script>
<script>
/* ================= Helpers ================= */
var STORAGE_KEY = 'kas-harian-store-v1';
var ACCESS_CODE_KEY = 'kas-harian-access-code';
var accessCode = localStorage.getItem(ACCESS_CODE_KEY) || '';

var DEFAULT_CATEGORIES = {
  income: ['Tarif Order', 'Tip', 'Bonus Mitra'],
  expense: ['Bensin', 'Makan', 'Parkir', 'Servis Motor', 'Pulsa/Data', 'Lainnya']
};
var TIP_PRESETS = [2000, 5000, 10000, 20000];

function todayStr() {
  var d = new Date();
  var off = d.getTimezoneOffset();
  var local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
}
function formatRupiah(n) {
  n = n || 0;
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function formatDMY(dateStr) {
  if (!dateStr) return '-';
  var parts = dateStr.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function daysUntil(dateStr) {
  var target = new Date(dateStr + 'T00:00:00');
  var today = new Date(todayStr() + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function addMonths(dateStr, n) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(parts[0], parts[1] - 1 + n, parts[2]);
  var yy = dt.getFullYear();
  var mm = String(dt.getMonth() + 1).padStart(2, '0');
  var dd = String(dt.getDate()).padStart(2, '0');
  return yy + '-' + mm + '-' + dd;
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function mergeTipIntoTransactions(txs, date, amountToAdd) {
  var idx = -1;
  for (var i = 0; i < txs.length; i++) {
    if (txs[i].type === 'income' && txs[i].category === 'Tip' && txs[i].date === date) { idx = i; break; }
  }
  if (idx >= 0) {
    var updated = txs.slice();
    updated[idx] = Object.assign({}, updated[idx], { amount: updated[idx].amount + amountToAdd });
    return updated;
  }
  return [{ id: uid(), date: date, type: 'income', category: 'Tip', note: 'Setoran tally tip harian', amount: amountToAdd, createdAt: Date.now() }].concat(txs);
}
function isValidBackup(obj) {
  return !!(obj && typeof obj === 'object' && Array.isArray(obj.transactions) && obj.categories &&
    Array.isArray(obj.categories.income) && Array.isArray(obj.categories.expense));
}

/* ================= Icons (SVG kecil, tanpa library luar) ================= */
function icon(paths, size) {
  size = size || 16;
  return '<svg class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
}
var ICONS = {
  plus: icon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  x: icon('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 12),
  check: icon('<polyline points="20 6 9 17 4 12"/>'),
  trash: icon('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>', 14),
  pencil: icon('<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>', 14),
  up: icon('<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>', 12),
  down: icon('<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>', 12),
  wallet: icon('<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>', 12),
  coins: icon('<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/>', 16),
  download: icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>', 14),
  upload: icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>', 14),
  copy: icon('<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', 14),
  shield: icon('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>', 16),
  chevron: icon('<polyline points="6 9 12 15 18 9"/>', 16),
  landmark: icon('<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/>', 16),
  alert: icon('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>', 18)
};

/* ================= State ================= */
var state = {
  categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
  transactions: [],
  tally: { date: todayStr(), count: 0, total: 0 },
  loans: [],
  filter: 'today',
  cloudStatus: 'idle',

  txType: 'income',
  txCategory: DEFAULT_CATEGORIES.income[0],
  txShowNewCat: false,
  txNewCatName: '',
  txAmount: '',
  txNote: '',
  txDate: todayStr(),
  txEditingId: null,
  txFormError: '',

  showLoanForm: false,
  loanEditingId: null,
  loanAppName: '',
  loanTenor: '',
  loanInstallment: '',
  loanDueDate: '',
  loanFormError: '',

  showBackupPanel: false,
  backupMsg: '',
  restoreText: '',
  restoreMsg: '',
  pendingRestore: null
};

/* ================= Persistence ================= */
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    var cats = parsed.categories || DEFAULT_CATEGORIES;
    var txs = parsed.transactions || [];
    var tly = parsed.tally || { date: todayStr(), count: 0, total: 0 };
    var lns = Array.isArray(parsed.loans) ? parsed.loans : [];

    var today = todayStr();
    if (tly.date !== today) {
      if (tly.total > 0) txs = mergeTipIntoTransactions(txs, tly.date, tly.total);
      tly = { date: today, count: 0, total: 0 };
    }

    state.categories = cats;
    state.transactions = txs;
    state.tally = tly;
    state.loans = lns;
    state.txCategory = (cats.income && cats.income[0]) || DEFAULT_CATEGORIES.income[0];
  } catch (e) {
    console.error('Gagal memuat data', e);
  }
}
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      categories: state.categories,
      transactions: state.transactions,
      tally: state.tally,
      loans: state.loans
    }));
  } catch (e) {
    console.error('Gagal menyimpan data', e);
  }
  pushToCloud();
}

/* ================= Sinkronisasi Cloud (Firebase) ================= */
function setAccessCode() {
  var el = document.getElementById('accessCodeInput');
  var val = el ? el.value.trim() : '';
  if (!val) return;
  localStorage.setItem(ACCESS_CODE_KEY, val);
  accessCode = val;
  render();
  initCloudSync();
}
function gantiKodeAkses() {
  localStorage.removeItem(ACCESS_CODE_KEY);
  accessCode = '';
  state.cloudStatus = 'idle';
  render();
}
function applyRemoteData(cloud) {
  var cats = (cloud.categories && cloud.categories.income) ? cloud.categories : DEFAULT_CATEGORIES;
  var txs = cloud.transactions || [];
  var tly = cloud.tally || { date: todayStr(), count: 0, total: 0 };
  var lns = Array.isArray(cloud.loans) ? cloud.loans : [];

  var today = todayStr();
  if (tly.date !== today) {
    if (tly.total > 0) txs = mergeTipIntoTransactions(txs, tly.date, tly.total);
    tly = { date: today, count: 0, total: 0 };
  }
  state.categories = cats;
  state.transactions = txs;
  state.tally = tly;
  state.loans = lns;
  state.txCategory = (cats.income && cats.income[0]) || DEFAULT_CATEGORIES.income[0];
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ categories: cats, transactions: txs, tally: tly, loans: lns }));
  } catch (e) {}
}
function initCloudSync() {
  if (!accessCode) return;
  if (!window.__fsDb) { state.cloudStatus = 'offline'; render(); return; }
  state.cloudStatus = 'connecting';
  render();
  var ref = window.__fsDoc(window.__fsDb, 'kas_harian', accessCode);
  window.__fsGetDoc(ref).then(function (snap) {
    if (snap.exists()) {
      applyRemoteData(snap.data());
      state.cloudStatus = 'connected';
      render();
    } else {
      return window.__fsSetDoc(ref, {
        categories: state.categories, transactions: state.transactions, tally: state.tally, loans: state.loans, updatedAt: Date.now()
      }).then(function () { state.cloudStatus = 'connected'; render(); });
    }
  }).catch(function (e) {
    console.error('Gagal sinkron ke cloud', e);
    state.cloudStatus = 'offline';
    render();
  });
}
function pushToCloud() {
  if (!accessCode || !window.__fsDb) return;
  var ref = window.__fsDoc(window.__fsDb, 'kas_harian', accessCode);
  window.__fsSetDoc(ref, {
    categories: state.categories, transactions: state.transactions, tally: state.tally, loans: state.loans, updatedAt: Date.now()
  }).then(function () {
    state.cloudStatus = 'connected';
    render();
  }).catch(function (e) {
    console.error('Gagal push ke cloud', e);
    state.cloudStatus = 'offline';
    render();
  });
}
function cloudStatusLabel() {
  if (state.cloudStatus === 'connected') return 'Tersambung ke cloud';
  if (state.cloudStatus === 'connecting') return 'Menyambungkan ke cloud...';
  if (state.cloudStatus === 'offline') return 'Offline, tersimpan di HP ini dulu';
  return '';
}
function renderAccessGate() {
  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">' +
    '<div class="card" style="max-width:360px;width:100%;"><div class="card-pad">' +
    '<div class="font-display" style="font-size:22px;margin-bottom:8px;">Kas Harian</div>' +
    '<p class="text-sm ink-soft mb-3">Masukkan Kode Akses kamu. Kalau ini pertama kali, bikin kode bebas (contoh: nama+tanggal lahir). Pakai kode yang sama di HP lain biar datanya sinkron.</p>' +
    '<input class="input mb-3" id="accessCodeInput" placeholder="Kode akses kamu" />' +
    '<button class="btn btn-primary btn-block" onclick="setAccessCode()">Lanjutkan</button>' +
    '</div></div></div>';
}


/* ================= Transaksi ================= */
function selectFilter(f) { state.filter = f; render(); }

function selectType(t) {
  state.txType = t;
  state.txShowNewCat = false;
  state.txNewCatName = '';
  var list = state.categories[t];
  state.txCategory = (list && list[0]) || '';
  render();
}
function onCategoryChange(value) {
  if (value === '__new__') { state.txShowNewCat = true; }
  else { state.txCategory = value; state.txShowNewCat = false; }
  render();
}
function cancelEditTx() {
  state.txEditingId = null;
  state.txType = 'income';
  var list = state.categories.income;
  state.txCategory = (list && list[0]) || '';
  state.txAmount = '';
  state.txNote = '';
  state.txDate = todayStr();
  state.txShowNewCat = false;
  state.txFormError = '';
  render();
}
function editTx(id) {
  var t = state.transactions.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  state.txEditingId = t.id;
  state.txType = t.type;
  state.txCategory = t.category;
  state.txAmount = String(t.amount);
  state.txNote = t.note || '';
  state.txDate = t.date;
  state.txShowNewCat = false;
  render();
  var el = document.getElementById('txFormCard');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function submitTx() {
  var effectiveCategories = state.categories;
  var effectiveCategory = state.txCategory;
  if (state.txShowNewCat) {
    var name = state.txNewCatName.trim();
    if (name) {
      if (state.categories[state.txType].indexOf(name) === -1) {
        effectiveCategories = Object.assign({}, state.categories);
        effectiveCategories[state.txType] = state.categories[state.txType].concat([name]);
      }
      effectiveCategory = name;
    } else {
      effectiveCategory = '';
    }
  }

  var amt = parseFloat(state.txAmount);
  if (!amt || amt <= 0) { state.txFormError = 'Isi jumlah lebih dari 0 dulu ya.'; render(); return; }
  if (!effectiveCategory) { state.txFormError = 'Isi nama kategori baru, atau pilih dari daftar.'; render(); return; }

  state.categories = effectiveCategories;
  state.txCategory = effectiveCategory;
  state.txShowNewCat = false;
  state.txNewCatName = '';
  state.txFormError = '';

  if (state.txEditingId) {
    state.transactions = state.transactions.map(function (t) {
      if (t.id !== state.txEditingId) return t;
      return Object.assign({}, t, { date: state.txDate, type: state.txType, category: effectiveCategory, note: state.txNote.trim(), amount: amt });
    });
    saveData();
    cancelEditTx();
    return;
  }

  var tx = { id: uid(), date: state.txDate, type: state.txType, category: effectiveCategory, note: state.txNote.trim(), amount: amt, createdAt: Date.now() };
  state.transactions = [tx].concat(state.transactions);
  state.txAmount = '';
  state.txNote = '';
  saveData();
  render();
}
function quickTip(amt) {
  state.tally = { date: todayStr(), count: state.tally.count + 1, total: state.tally.total + amt };
  saveData();
  render();
}
function commitTally() {
  if (!state.tally.total || state.tally.total <= 0) return;
  var today = todayStr();
  state.transactions = mergeTipIntoTransactions(state.transactions, today, state.tally.total);
  state.tally = { date: today, count: 0, total: 0 };
  saveData();
  render();
}
function deleteTx(id) {
  var target = state.transactions.filter(function (t) { return t.id === id; })[0];
  state.transactions = state.transactions.filter(function (t) { return t.id !== id; });

  if (target && target.loanId) {
    state.loans = state.loans.map(function (l) {
      if (l.id !== target.loanId) return l;
      var newTenorPaid = Math.max((l.tenorPaid || 0) - 1, 0);
      return Object.assign({}, l, { tenorPaid: newTenorPaid, dueDate: addMonths(l.dueDate, -1) });
    });
  }
  saveData();
  if (state.txEditingId === id) { cancelEditTx(); return; }
  render();
}

/* ================= Pinjaman ================= */
function resetLoanForm() {
  state.loanEditingId = null;
  state.loanAppName = '';
  state.loanTenor = '';
  state.loanInstallment = '';
  state.loanDueDate = '';
  state.loanFormError = '';
}
function openAddLoan() { resetLoanForm(); state.showLoanForm = true; render(); }
function toggleLoanForm() {
  if (state.showLoanForm) { resetLoanForm(); state.showLoanForm = false; render(); }
  else { openAddLoan(); }
}
function editLoan(id) {
  var l = state.loans.filter(function (x) { return x.id === id; })[0];
  if (!l) return;
  state.loanEditingId = l.id;
  state.loanAppName = l.appName;
  state.loanTenor = String(l.tenor);
  state.loanInstallment = String(l.installmentAmount);
  state.loanDueDate = l.dueDate;
  state.loanFormError = '';
  state.showLoanForm = true;
  render();
}
function submitLoan() {
  var name = state.loanAppName.trim();
  var tenorNum = parseInt(state.loanTenor, 10);
  var installmentNum = parseFloat(state.loanInstallment);

  if (!name) { state.loanFormError = 'Isi nama aplikasi pinjaman dulu.'; render(); return; }
  if (!tenorNum || tenorNum <= 0) { state.loanFormError = 'Isi tenor angsuran (dalam bulan), harus lebih dari 0.'; render(); return; }
  if (!installmentNum || installmentNum <= 0) { state.loanFormError = 'Isi nominal cicilan, harus lebih dari 0.'; render(); return; }
  if (!state.loanDueDate) { state.loanFormError = 'Pilih tanggal jatuh tempo.'; render(); return; }

  if (state.loanEditingId) {
    state.loans = state.loans.map(function (l) {
      if (l.id !== state.loanEditingId) return l;
      return Object.assign({}, l, {
        appName: name, tenor: tenorNum, installmentAmount: installmentNum, dueDate: state.loanDueDate,
        tenorPaid: Math.min(l.tenorPaid || 0, tenorNum)
      });
    });
  } else {
    var loan = { id: uid(), appName: name, tenor: tenorNum, tenorPaid: 0, installmentAmount: installmentNum, dueDate: state.loanDueDate, createdAt: Date.now() };
    state.loans = [loan].concat(state.loans);
  }
  saveData();
  resetLoanForm();
  state.showLoanForm = false;
  render();
}
function deleteLoan(id) {
  state.loans = state.loans.filter(function (l) { return l.id !== id; });
  saveData();
  if (state.loanEditingId === id) resetLoanForm();
  render();
}
function loanPaid(id) {
  var loan = state.loans.filter(function (l) { return l.id === id; })[0];
  if (!loan) return;
  var catName = 'Cicilan Pinjaman';
  if (state.categories.expense.indexOf(catName) === -1) {
    state.categories = Object.assign({}, state.categories, { expense: state.categories.expense.concat([catName]) });
  }
  var tenorPaidBefore = loan.tenorPaid || 0;
  var installmentNo = tenorPaidBefore + 1;
  var tx = {
    id: uid(), date: todayStr(), type: 'expense', category: catName,
    note: 'Cicilan ' + loan.appName + ' (' + installmentNo + '/' + loan.tenor + ')',
    amount: loan.installmentAmount, loanId: loan.id, createdAt: Date.now()
  };
  state.transactions = [tx].concat(state.transactions);

  var newTenorPaid = tenorPaidBefore + 1;
  var isFinished = newTenorPaid >= loan.tenor;
  var nextDueDate = isFinished ? loan.dueDate : addMonths(loan.dueDate, 1);
  state.loans = state.loans.map(function (l) { return l.id === loan.id ? Object.assign({}, l, { tenorPaid: newTenorPaid, dueDate: nextDueDate }) : l; });

  saveData();
  render();
}
function getLoanReminders() {
  return state.loans.filter(function (l) { return (l.tenorPaid || 0) < l.tenor && daysUntil(l.dueDate) <= 7; })
    .sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); });
}

/* ================= Backup & Restore ================= */
function buildBackupPayload() {
  return JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), categories: state.categories, transactions: state.transactions, tally: state.tally, loans: state.loans }, null, 2);
}
function toggleBackupPanel() { state.showBackupPanel = !state.showBackupPanel; render(); }
function downloadBackup() {
  try {
    var blob = new Blob([buildBackupPayload()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'kas-harian-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    state.backupMsg = 'File backup diunduh. Simpan di tempat aman ya.';
  } catch (e) {
    state.backupMsg = 'Gagal mengunduh file. Coba salin teks di bawah sebagai gantinya.';
  }
  render();
}
function copyBackup() {
  var payload = buildBackupPayload();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload).then(function () {
      state.backupMsg = 'Teks backup sudah disalin ke clipboard.';
      render();
    }).catch(function () {
      state.backupMsg = 'Gagal menyalin otomatis. Salin manual dari kotak teks di bawah.';
      render();
    });
  } else {
    state.backupMsg = 'Gagal menyalin otomatis. Salin manual dari kotak teks di bawah.';
    render();
  }
}
function handleFileChosen(input) {
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(reader.result);
      if (!isValidBackup(parsed)) { state.restoreMsg = 'File ini bukan format backup Kas Harian yang dikenali.'; render(); return; }
      state.restoreMsg = '';
      state.pendingRestore = parsed;
      render();
    } catch (err) {
      state.restoreMsg = 'File tidak bisa dibaca. Pastikan file .json yang benar.';
      render();
    }
  };
  reader.onerror = function () { state.restoreMsg = 'Gagal membaca file.'; render(); };
  reader.readAsText(file);
}
function restoreFromText() {
  var text = state.restoreText.trim();
  if (!text) { state.restoreMsg = 'Tempel dulu teks backup-nya di kotak ini.'; render(); return; }
  try {
    var parsed = JSON.parse(text);
    if (!isValidBackup(parsed)) { state.restoreMsg = 'Teks ini bukan format backup Kas Harian yang dikenali.'; render(); return; }
    state.restoreMsg = '';
    state.pendingRestore = parsed;
    render();
  } catch (err) {
    state.restoreMsg = 'Format teks tidak valid (bukan JSON yang benar).';
    render();
  }
}
function cancelRestore() { state.pendingRestore = null; render(); }
function confirmRestore() {
  var p = state.pendingRestore;
  if (!p) return;
  var cats = (p.categories && p.categories.income) ? p.categories : DEFAULT_CATEGORIES;
  var txs = p.transactions || [];
  var tly = (p.tally && p.tally.date) ? p.tally : { date: todayStr(), count: 0, total: 0 };
  var lns = Array.isArray(p.loans) ? p.loans : [];

  state.categories = cats;
  state.transactions = txs;
  state.tally = tly;
  state.loans = lns;
  state.txCategory = (cats.income && cats.income[0]) || DEFAULT_CATEGORIES.income[0];
  state.txEditingId = null;
  state.txShowNewCat = false;
  state.restoreText = '';
  state.pendingRestore = null;
  state.restoreMsg = 'Data berhasil dipulihkan dari backup.';
  saveData();
  render();
}

/* ================= Input draft (tanpa render supaya fokus tidak hilang) ================= */
function draftSet(field, value) { state[field] = value; }

/* ================= Render ================= */
function computeFiltered() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  return state.transactions.filter(function (t) {
    if (state.filter === 'today') return t.date === todayStr();
    var d = new Date(t.date + 'T00:00:00');
    return d.getFullYear() === y && d.getMonth() === m;
  }).sort(function (a, b) { return b.createdAt - a.createdAt; });
}
function computeTotals(filtered) {
  var income = 0, expense = 0;
  filtered.forEach(function (t) { if (t.type === 'income') income += t.amount; else expense += t.amount; });
  return { income: income, expense: expense, net: income - expense };
}
function recordedTipToday() {
  var today = todayStr();
  var tx = state.transactions.filter(function (t) { return t.type === 'income' && t.category === 'Tip' && t.date === today; })[0];
  return tx ? tx.amount : 0;
}

  return '<div class="card">' +
    '<div class="card-head"><div class="card-title">' + ICONS.landmark + ' Pinjaman</div>' +
    '<button class="btn btn-soft-income btn-sm" onclick="toggleLoanForm()">' + (state.showLoanForm ? (ICONS.x + ' Tutup') : (ICONS.plus + ' Tambah')) + '</button>' +
    '</div>' +
    (state.showLoanForm ? renderLoanForm() : '') +
    renderLoanList() +
    '</div>';
}

function renderBackupCard() {
  var panel = '';
  if (state.showBackupPanel) {
    panel = '<div class="card-pad" style="border-top:1px solid var(--line)">' +
      '<div class="row-between mb-3" style="background:var(--bg);border-radius:10px;padding:8px 12px;">' +
      '<div class="text-xs">Kode akses: <span class="mono" style="font-weight:600">' + escapeHtml(accessCode) + '</span><br/><span class="ink-soft">Pakai kode ini juga di HP lain biar sinkron</span></div>' +
      '<button class="btn btn-outline btn-sm" onclick="gantiKodeAkses()">Ganti</button>' +
      '</div>' +
      '<p class="text-xs ink-soft mb-3">Cadangkan sebelum revisi besar, biar aman kalau ada perubahan yang tidak diinginkan.</p>' +
      '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
      '<button class="btn btn-primary flex-1" onclick="downloadBackup()">' + ICONS.download + ' Unduh Backup</button>' +
      '<button class="btn btn-soft-income flex-1" onclick="copyBackup()">' + ICONS.copy + ' Salin Teks</button>' +
      '</div>' +
      (state.backupMsg ? '<p class="text-xs mb-3" style="color:var(--primary)">' + escapeHtml(state.backupMsg) + '</p>' : '') +
      '<textarea class="input mono text-xs" readonly style="height:72px;" onfocus="this.select()">' + escapeHtml(buildBackupPayload()) + '</textarea>' +
      '<div style="padding-top:12px;margin-top:12px;border-top:1px dashed var(--line);">' +
      '<p class="text-xs mb-2" style="font-weight:500;">Pulihkan dari backup</p>' +
      '<input type="file" id="restoreFileInput" accept="application/json,.json" class="hidden" onchange="handleFileChosen(this)" />' +
      '<button class="btn btn-outline btn-block mb-2" onclick="document.getElementById(\'restoreFileInput\').click()">' + ICONS.upload + ' Pilih File Backup (.json)</button>' +
      '<p class="text-xs ink-soft mb-1">Atau tempel teks backup di sini:</p>' +
      '<textarea class="input mono text-xs mb-2" style="height:72px;" placeholder="Tempel teks backup (JSON) di sini&hellip;" oninput="draftSet(\'restoreText\', this.value); state.restoreMsg=\'\';">' + escapeHtml(state.restoreText) + '</textarea>' +
      '<button class="btn btn-soft-expense btn-block" onclick="restoreFromText()">Pulihkan dari Teks</button>' +
      (state.restoreMsg ? '<p class="text-xs mt-2" style="color:var(--expense)">' + escapeHtml(state.restoreMsg) + '</p>' : '') +
      '</div></div>';
  }
  return '<div class="card">' +
    '<button class="card-head" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;" onclick="toggleBackupPanel()">' +
    '<div class="card-title">' + ICONS.shield + ' Cadangkan &amp; Pulihkan Data</div>' +
    '<span style="' + (state.showBackupPanel ? 'transform:rotate(180deg);display:inline-flex;' : 'display:inline-flex;') + 'color:var(--ink-soft)">' + ICONS.chevron + '</span>' +
    '</button>' + panel + '</div>';
}

function renderRestoreModal() {
  if (!state.pendingRestore) return '';
  var p = state.pendingRestore;
  var txCount = (p.transactions || []).length;
  var exportedInfo = p.exportedAt ? (', dibuat ' + new Date(p.exportedAt).toLocaleString('id-ID')) : '';
  return '<div class="modal-overlay"><div class="modal-box">' +
    '<div class="font-display" style="font-size:18px;margin-bottom:8px;">Pulihkan data ini?</div>' +
    '<p class="text-sm ink-soft mb-1">Backup berisi <span style="color:var(--ink);font-weight:500">' + txCount + ' transaksi</span>' + exportedInfo + '.</p>' +
    '<p class="text-sm mb-3" style="color:var(--expense)">Data yang ada sekarang akan ditimpa dan tidak bisa dikembalikan.</p>' +
    '<div style="display:flex;gap:8px;">' +
    '<button class="btn btn-outline flex-1" onclick="cancelRestore()">Batal</button>' +
    '<button class="btn flex-1" style="background:var(--expense);color:#fff;" onclick="confirmRestore()">Ya, Timpa Data</button>' +
    '</div></div></div>';
}

function render() {
  if (!accessCode) {
    document.getElementById('root').innerHTML = renderAccessGate();
    return;
  }
  var filtered = computeFiltered();
  var totals = computeTotals(filtered);

  var html = renderHeader(totals) +
    '<div class="content"><div class="container">' +
    renderTallyCard() +
    renderReminderBanner() +
    renderTxForm() +
    renderRiwayat(filtered) +
    renderLoanCard() +
    renderBackupCard() +
    '</div></div>' +
    renderRestoreModal();

  document.getElementById('root').innerHTML = html;
}

/* ================= Init ================= */
document.addEventListener('DOMContentLoaded', function () {
  loadData();
  render();
  if (accessCode) initCloudSync();
});


</script>
</body>
</html>
